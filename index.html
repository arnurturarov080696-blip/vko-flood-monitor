<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Паводковая обстановка ВКО</title>
  <meta name="description" content="Уровни воды на гидропостах Восточно-Казахстанской области, предупреждения и памятка для жителей. Неофициальный ресурс.">
  <meta name="theme-color" content="#12324a">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- FR-1: постоянная плашка -->
  <div class="disclaimer" role="note">
    <span data-i18n="disclaimer"></span>
    <a href="https://www.kazhydromet.kz" target="_blank" rel="noopener" data-i18n="kgm"></a>
    <span data-i18n="and"></span>
    <a href="https://www.gov.kz/memleket/entities/emer" target="_blank" rel="noopener" data-i18n="mchs"></a>
  </div>

  <header class="header">
    <div class="wrap header-top">
      <div class="brand">
        <h1 data-i18n="title"></h1>
        <p data-i18n="subtitle"></p>
      </div>
      <div class="header-actions">
        <div class="lang" role="group" aria-label="Язык / Тіл">
          <button type="button" data-lang="kk">ҚАЗ</button>
          <button type="button" data-lang="ru">РУС</button>
        </div>
        <a class="btn-112" href="tel:112"><span aria-hidden="true">☎</span> <span data-i18n="call112"></span></a>
      </div>
    </div>
    <!-- FR-2: выбор даты -->
    <div class="wrap timebar">
      <button type="button" id="play" class="play" aria-label=""><span aria-hidden="true">▶</span></button>
      <label class="date-label" for="slider"><span data-i18n="date"></span>: <strong id="date-text"></strong></label>
      <input type="range" id="slider" min="0" max="0" step="1" value="0">
      <button type="button" id="to-latest" class="to-latest" data-i18n="to_latest"></button>
    </div>
  </header>

  <main class="wrap">
    <div id="notices" class="notices" aria-live="polite"></div>

    <!-- FR-4..7 -->
    <section class="kpis" id="kpis" aria-label="Сводка"></section>

    <div class="grid">
      <section class="panel map-panel">
        <div class="panel-head">
          <h2 data-i18n="map_title"></h2>
          <span class="muted small" data-i18n="map_hint"></span>
        </div>
        <div id="map" class="map"></div>
        <ul class="legend">
          <li><span class="dot dot-norm"></span><span data-i18n="legend_norm"></span></li>
          <li><span class="dot dot-nya"></span><span data-i18n="legend_nya"></span></li>
          <li><span class="dot dot-crit"></span><span data-i18n="legend_crit"></span></li>
        </ul>
      </section>

      <section class="panel card-panel" id="card" aria-live="polite"></section>
    </div>

    <div class="grid">
      <section class="panel">
        <div class="panel-head">
          <h2 data-i18n="table_title"></h2>
          <span class="muted small" data-i18n="table_hint"></span>
        </div>
        <div class="table-wrap">
          <table class="posts" id="posts">
            <thead>
              <tr>
                <th data-sort="danger"><button type="button"><span data-i18n="th_post"></span></button></th>
                <th data-sort="level" class="num"><button type="button"><span data-i18n="th_level"></span></button></th>
                <th data-sort="delta" class="num"><button type="button"><span data-i18n="th_delta"></span></button></th>
                <th data-sort="margin" class="num"><button type="button"><span data-i18n="th_margin"></span></button></th>
                <th data-sort="fill" class="fill-col"><button type="button"><span data-i18n="th_fill"></span></button></th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </section>

      <section class="panel">
        <div class="panel-head">
          <h2 data-i18n="warn_title"></h2>
          <label class="threshold">
            <span data-i18n="threshold"></span>
            <input type="number" id="threshold" min="5" max="200" step="1" inputmode="numeric">
            <span data-i18n="cm_day"></span>
          </label>
        </div>
        <ul class="warnings" id="warnings"></ul>
      </section>
    </div>

    <!-- FR-22..24 -->
    <section class="help" id="help">
      <div class="panel">
        <h2 data-i18n="help_title"></h2>
        <ul class="contacts" id="contacts"></ul>
      </div>
      <div class="panel">
        <h2 data-i18n="memo_title"></h2>
        <ol class="memo" id="memo"></ol>
      </div>
      <div class="panel">
        <h2 data-i18n="links_title"></h2>
        <ul class="links">
          <li><a href="https://www.kazhydromet.kz" target="_blank" rel="noopener" data-i18n="link_kgm"></a></li>
          <li><a href="https://www.gov.kz/memleket/entities/emer" target="_blank" rel="noopener" data-i18n="link_mchs"></a></li>
        </ul>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="wrap">
      <p data-i18n="footer"></p>
      <p class="muted" data-i18n="footer_map"></p>
    </div>
  </footer>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script src="data/data.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
